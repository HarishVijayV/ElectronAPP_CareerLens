# CareerLens — local infrastructure
#
# Default services (no profile needed) = everything the WEB APP needs day-to-day:
#   postgres, redis, kafka, adminer, gateway, auth-service, agent-service,
#   worker-service, notification-service
#
# `bigdata` profile = the heavier data-engineering stack, started only when you're
# actually working on the pipeline (Hadoop + Airflow are resource-hungry, no point
# running them while you're just building login pages):
#   docker compose --profile bigdata up -d
#
# See docs/LOCAL_SETUP.md for full instructions.

services:
  # ---------------------------------------------------------------- core infra
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    # Docker gives every container 64MB of /dev/shm, and Postgres uses shared memory for
    # parallel query workers. A ranked search over the 151k-row fact table exceeded it and
    # failed with "could not resize shared memory segment ... No space left on device" —
    # a message that points at the disk, which had 894GB free. It is not the disk.
    #
    # 64MB is fine for a toy dataset and quietly wrong for a real one, so this will bite
    # again on any host that doesn't set it, including the cloud VM.
    shm_size: 256mb
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka in KRaft mode — no ZooKeeper. KRaft replaced it in modern Kafka, so a
  # single-container broker is now genuinely simple to run.
  #
  # Using the OFFICIAL apache/kafka image rather than bitnami/kafka: Bitnami moved their
  # community images behind a paid registry in 2025, so `bitnami/kafka:3.7` now fails to
  # pull entirely. Worth knowing as a general lesson — pinning an image tag doesn't
  # protect you if the publisher withdraws the repository.
  kafka:
    restart: unless-stopped
    image: apache/kafka:3.8.1
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      # TWO client listeners, and this is not optional — it's the #1 Kafka-in-Docker trap.
      #
      # A client's first request returns the broker's ADVERTISED address, and the client
      # then reconnects to whatever it was told. With only `kafka:9092` advertised, a
      # process on the host connects to localhost:9092, is told "the broker is at
      # kafka:9092", cannot resolve that name, and silently fails to deliver — the
      # producer looks fine and the topic stays empty. (Hit exactly that here.)
      #
      #   inside compose network -> kafka:9092
      #   from the host machine  -> localhost:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-node dev cluster: replication of 1 is the only valid setting here.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: careerlens-local-cluster
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Kafka speaks a binary protocol over TCP, not HTTP — opening localhost:29092 in a
  # browser returns ERR_EMPTY_RESPONSE, because there is no web server there to answer.
  # This gives the broker an actual UI: topics, partitions, and the messages themselves.
  #
  # Same bigdata profile, so it only runs when you ask for Kafka anyway.
  kafka-ui:
    restart: unless-stopped
    image: provectuslabs/kafka-ui:latest
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: careerlens
      # kafka:9092 because this container is INSIDE the compose network — the same
      # distinction that made host publishing fail silently until it was detected.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    profiles: [bigdata]

  adminer:
    restart: unless-stopped
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  # ---------------------------------------------------------------- app services
  gateway:
    restart: unless-stopped
    build: ../services/gateway
    env_file: .env
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../services/gateway/app:/app/app

  auth-service:
    restart: unless-stopped
    build: ../services/auth-service
    env_file: .env
    ports:
      - "${AUTH_SERVICE_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../services/auth-service/app:/app/app

  agent-service:
    restart: unless-stopped
    build: ../services/agent-service
    env_file: .env
    ports:
      - "${AGENT_SERVICE_PORT:-8002}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../services/agent-service/app:/app/app

  jobs-service:
    restart: unless-stopped
    build: ../services/jobs-service
    env_file: .env
    ports:
      - "${JOBS_SERVICE_PORT:-8003}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../services/jobs-service/app:/app/app
    networks:
      - default
      - mcp-net

  worker-service:
    restart: unless-stopped
    build: ../services/worker-service
    env_file: .env
    command: celery -A app.celery_app worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ../services/worker-service/app:/app/app

  # The Kafka consumer that turns posting.discovered events into bell notifications.
  #
  # Its own container rather than a command you remember to run. A notification system
  # that only works while someone holds a terminal open is a demo, not a system — and the
  # events it misses are gone, because the consumer group's offset only advances while
  # something is actually consuming.
  #
  # Separate from worker-service despite sharing an image: that one is a Celery worker
  # pulling from Redis, this one is a Kafka consumer with a completely different lifecycle.
  # One command per container is what lets Docker restart the right thing when it dies.
  #
  # bigdata profile because it needs Kafka. Without the profile there is no broker to
  # consume from, and it would restart-loop forever against a host that does not exist.
  match-notifier:
    restart: unless-stopped
    build: ../services/worker-service
    env_file: .env
    command: python -m app.consumers.match_notifier
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ../services/worker-service/app:/app/app
    profiles: [bigdata]

  notification-service:
    restart: unless-stopped
    build: ../services/notification-service
    env_file: .env
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8004}:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../services/notification-service/app:/app/app

  # MCP server — exposes ONLY aggregate job-market data to external MCP clients.
  # Note what it depends on: jobs-service, and nothing else. It holds no database
  # credentials and has no route to auth-service, so the privacy boundary in its
  # docstring is enforced by deployment topology, not just by code.
  mcp-server:
    restart: unless-stopped
    build: ../services/mcp-server
    environment:
      JOBS_SERVICE_URL: http://jobs-service:8000
    ports:
      - "${MCP_SERVER_PORT:-8005}:8005"
    depends_on:
      - jobs-service
    volumes:
      - ../services/mcp-server/app:/app/app
    # ONLY mcp-net — deliberately NOT on `default`. This is what makes the privacy
    # boundary real rather than documented: auth-service, postgres and redis are not
    # resolvable from this container at all, so there is no network path to a resume,
    # an inbox, or a user account. Matters especially because auth-service trusts the
    # X-User-Id header, which a same-network attacker could otherwise forge.
    networks:
      - mcp-net

  frontend:
    restart: unless-stopped
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # This URL is resolved by the BROWSER, not by this container — so it must be
      # localhost:8000 (the host's mapped gateway port), never gateway:8000. Docker
      # service names only resolve inside the compose network, and the browser isn't in it.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
      WATCHPACK_POLLING: "true"   # file-change events don't cross the Windows/WSL bind mount reliably
    depends_on:
      - gateway
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      # Anonymous volume pins the container's own node_modules. Without it the host's
      # node_modules (built for Windows) would shadow the Linux ones installed in the
      # image, and native binaries would fail to load.
      - /app/node_modules
      - /app/.next

  # ---------------------------------------------------------------- bigdata profile
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    environment:
      - CLUSTER_NAME=careerlens
    env_file: ./hadoop.env
    ports:
      - "9870:9870" # HDFS web UI
      - "9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    profiles: [bigdata]

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file: ./hadoop.env
    depends_on:
      - namenode
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    profiles: [bigdata]

  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    profiles: [bigdata]

  airflow-init:
    build:
      context: ..
      dockerfile: infra/airflow.Dockerfile
    depends_on:
      - airflow-db
    # Airflow shells out to the pipeline's scripts, so it needs the pipeline's
    # credentials. Without this the ingest ran, found no Adzuna keys, and wrote an EMPTY
    # real_postings.jsonl over the real one — a task that reports success while destroying
    # data is far worse than one that fails.
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com"
    profiles: [bigdata]

  airflow-webserver:
    build:
      context: ..
      dockerfile: infra/airflow.Dockerfile
    depends_on:
      - airflow-init
    # Airflow shells out to the pipeline's scripts, so it needs the pipeline's
    # credentials. Without this the ingest ran, found no Adzuna keys, and wrote an EMPTY
    # real_postings.jsonl over the real one — a task that reports success while destroying
    # data is far worse than one that fails.
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Inside the compose network Postgres is `postgres`, not localhost. dbt's profile
      # reads this, so the same profiles.yml works from a laptop and from a container.
      DBT_POSTGRES_HOST: postgres
      # Spark inside Airflow shares the machine with every other container, so it cannot
      # have the 4g a standalone run gets. Asking for more than is free makes the JVM die
      # mid-fit with a Py4JError that reads like a Spark bug.
      SPARK_DRIVER_MEMORY: 2g
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # The pipeline scripts take a full URL rather than parts.
      PIPELINE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: webserver
    ports:
      # 8090, not 8080: k8s/kind-config.yaml maps host 8080 to the kind ingress, and the
      # second stack to start would die with "port is already allocated". Overridable via
      # AIRFLOW_PORT the same way every other port here is.
      - "${AIRFLOW_PORT:-8090}:8080"
    volumes:
      - ../pipeline/airflow/dags:/opt/airflow/dags
      - ../pipeline:/opt/airflow/pipeline
    profiles: [bigdata]

  airflow-scheduler:
    build:
      context: ..
      dockerfile: infra/airflow.Dockerfile
    depends_on:
      - airflow-init
    # Airflow shells out to the pipeline's scripts, so it needs the pipeline's
    # credentials. Without this the ingest ran, found no Adzuna keys, and wrote an EMPTY
    # real_postings.jsonl over the real one — a task that reports success while destroying
    # data is far worse than one that fails.
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Inside the compose network Postgres is `postgres`, not localhost. dbt's profile
      # reads this, so the same profiles.yml works from a laptop and from a container.
      DBT_POSTGRES_HOST: postgres
      # Spark inside Airflow shares the machine with every other container, so it cannot
      # have the 4g a standalone run gets. Asking for more than is free makes the JVM die
      # mid-fit with a Py4JError that reads like a Spark bug.
      SPARK_DRIVER_MEMORY: 2g
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # The pipeline scripts take a full URL rather than parts.
      PIPELINE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: scheduler
    volumes:
      - ../pipeline/airflow/dags:/opt/airflow/dags
      - ../pipeline:/opt/airflow/pipeline
    profiles: [bigdata]

networks:
  default:
  # Isolated segment shared by exactly two services: mcp-server and jobs-service.
  mcp-net:

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  hadoop_namenode:
  hadoop_datanode:
  airflow_db_data:
