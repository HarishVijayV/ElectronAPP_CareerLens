{{/*
Non-secret configuration. Everything here is readable by anyone with cluster access, so
nothing sensitive belongs in it — that's the entire distinction between a ConfigMap and a
Secret.

Service discovery is the interesting part: `http://careerlens-auth-service:8000` is a DNS
name Kubernetes creates automatically from the Service name. No IP addresses, no config
to update when a pod moves or restarts — the name always resolves to whatever pods are
currently healthy. That's the same job docker-compose service names did locally.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "careerlens.labels" . | nindent 4 }}
data:
  # ---- datastores (in-cluster DNS names) ----
  POSTGRES_HOST: "{{ .Release.Name }}-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: {{ .Values.config.postgresUser | quote }}
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
  REDIS_URL: "redis://{{ .Release.Name }}-redis:6379/0"

  # ---- service-to-service URLs ----
  AUTH_SERVICE_URL: "http://{{ .Release.Name }}-auth-service:8000"
  AGENT_SERVICE_URL: "http://{{ .Release.Name }}-agent-service:8000"
  JOBS_SERVICE_URL: "http://{{ .Release.Name }}-jobs-service:8000"
  NOTIFICATION_SERVICE_URL: "http://{{ .Release.Name }}-notification-service:8000"

  # ---- app config ----
  LLM_PROVIDER: {{ .Values.config.llmProvider | quote }}
  FIREWORKS_MODEL: {{ .Values.config.fireworksModel | quote }}
  FIREWORKS_FALLBACK_MODEL: {{ .Values.config.fireworksFallbackModel | quote }}
  FRONTEND_ORIGIN: {{ .Values.config.frontendOrigin | quote }}
  FRONTEND_URL: {{ .Values.config.frontendOrigin | quote }}
  ACCESS_TOKEN_EXPIRE_MINUTES: {{ .Values.config.accessTokenExpireMinutes | quote }}
  REFRESH_TOKEN_EXPIRE_DAYS: {{ .Values.config.refreshTokenExpireDays | quote }}
  JWT_ALGORITHM: "HS256"
  COOKIE_SECURE: "false"
  COOKIE_DOMAIN: "localhost"
  GOOGLE_REDIRECT_URI: "{{ .Values.config.frontendOrigin }}/api/auth/google/callback"
